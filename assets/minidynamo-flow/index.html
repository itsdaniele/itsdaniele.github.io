<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Inside @compile — minidynamo</title>
    <link rel="stylesheet" href="style.css?v=2" />
    <script src="app.js?v=2" defer></script>
  </head>
  <body>
    <main class="walkthrough" aria-label="How minidynamo compiles and reuses a function">
      <noscript
        ><p>
          The first call traces the function, compiles its graph, and caches the callable with guards. Later calls check those guards and reuse a
          matching callable. Enable JavaScript to play the animation.
        </p></noscript
      >
      <div id="interactive" hidden>
        <header>
          <span id="phase">Before the first call</span>
          <span id="step-count" aria-label="Current step"></span>
        </header>
        <div id="scene" role="img" aria-label="A function decorated with minidynamo.compile"></div>
        <section class="caption" aria-live="polite" aria-atomic="true">
          <h1 id="step-title"></h1>
          <p id="step-detail"></p>
        </section>
        <button type="button" id="play">Play first call <span aria-hidden="true">→</span></button>
      </div>
    </main>
  </body>
</html>
