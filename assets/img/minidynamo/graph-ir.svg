>
  <title id="title">From source to captured graph</title>
  <desc id="description">
    Python adds x and y, multiplies by the constant 2, then sums. The captured graph connects the two inputs to torch.add, torch.mul with constant 2,
    the sum method, and the output.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="760" height="456" rx="10" fill="#ffffff" />
  <text x="24" y="42" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">Python source</text>
  <rect x="24" y="60" width="308" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="42" y="94" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    def fn(x, y):
  </text>
  <text x="42" y="124" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        z = x + y
  </text>
  <text x="42" y="154" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        w = z * 2
  </text>
  <text x="42" y="184" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        return w.sum()
  </text>
