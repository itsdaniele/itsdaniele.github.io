<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 352"
  role="img"
  aria-labelledby="title description"
  font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
>
  <title id="title">The first four bytecode instructions</title>
  <desc id="description">
    Stack entries are symbolic values, shown bottom to top. LOAD_FAST pushes x then y. BINARY_ADD pops both, records torch.add(x, y), and pushes
    add_0. STORE_FAST pops add_0 into local z. Only BINARY_ADD adds a graph node.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="760" height="352" rx="10" fill="#ffffff" />
  <text x="24" y="35" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">Instruction</text>
  <text x="270" y="35" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">Stack after</text>
  <text x="474" y="35" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">New graph node</text>
  <text x="24" y="98" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    LOAD_FAST x
  </text>
  <text x="270" y="98" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    [x]
  </text>
  <text x="474" y="98" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    —
  </text>
  <line x1="24" y1="126" x2="736" y2="126" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="24" y="170" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    LOAD_FAST y
  </text>
  <text x="270" y="170" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    [x, y]
  </text>
  <text x="474" y="170" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    —
  </text>
  <line x1="24" y1="198" x2="736" y2="198" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="12" y="202" width="736" height="64" rx="8" fill="#fff7ed" stroke="#fed7aa" />
  <text x="24" y="242" font-size="20" fill="#c2410c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    BINARY_ADD
  </text>
  <text x="270" y="242" font-size="20" fill="#c2410c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    [add_0]
  </text>
  <text x="474" y="242" font-size="20" fill="#c2410c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    torch.add(x, y)
  </text>
  <line x1="24" y1="270" x2="736" y2="270" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="24" y="314" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    STORE_FAST z
  </text>
  <text x="270" y="314" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    []
  </text>
  <text x="474" y="314" font-size="20" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    —
  </text>
</svg>
