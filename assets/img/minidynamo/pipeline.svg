<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 252"
  role="img"
  aria-labelledby="title description"
  font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
>
  <title id="title">First call and cached execution</title>
  <desc id="description">
    The first call traces, compiles, builds guards, caches, and executes. Later calls check guards and reuse the matching compiled function.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="760" height="252" rx="10" fill="#ffffff" />
  <text x="24" y="34" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">First call</text>
  <rect x="24" y="54" width="128" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="88" y="88" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="600">Trace</text>
  <line x1="152" y1="81" x2="168" y2="81" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="170" y="54" width="128" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="234" y="88" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="600">Compile</text>
  <line x1="298" y1="81" x2="314" y2="81" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="316" y="54" width="128" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="380" y="88" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="600">Guards</text>
  <line x1="444" y1="81" x2="460" y2="81" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="462" y="54" width="128" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="526" y="88" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="600">Cache</text>
  <line x1="590" y1="81" x2="606" y2="81" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="608" y="54" width="128" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="672" y="88" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="600">Execute</text>
  <text x="24" y="153" font-size="20" fill="#1f2937" text-anchor="start" font-weight="600">Later calls</text>
  <rect x="24" y="174" width="180" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e" />
  <text x="114" y="208" font-size="20" fill="#0f766e" text-anchor="middle">Check guards</text>
  <line x1="204" y1="201" x2="604" y2="201" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="404" y="188" font-size="18" fill="#4b5563" text-anchor="middle">match</text>
  <rect x="608" y="174" width="128" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e" />
  <text x="672" y="208" font-size="20" fill="#0f766e" text-anchor="middle" font-weight="600">Execute</text>
</svg>
