<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 342"
  role="img"
  aria-labelledby="title description"
  font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
>
  <title id="title">Use the first matching cache entry</title>
  <desc id="description">
    For incoming tensors of shape (5, 6), the first cache entry with shape guards for (3, 4) misses. The second entry matches and executes its
    compiled function, provided its other guards pass. The third entry is not checked.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="760" height="342" rx="10" fill="#ffffff" />
  <text x="24" y="36" font-size="22" fill="#1f2937" text-anchor="start" font-weight="600">Incoming tensors: shape (5, 6)</text>
  <text x="24" y="70" font-size="18" fill="#4b5563" text-anchor="start">Shape guards shown; other guards must also pass.</text>
  <rect x="24" y="96" width="712" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="44" y="136" font-size="22" fill="#4b5563" text-anchor="start" font-weight="600">1</text>
  <text x="104" y="136" font-size="22" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    shape == (3, 4)
  </text>
  <text x="478" y="136" font-size="22" fill="#4b5563" text-anchor="start">Miss</text>
  <rect x="24" y="174" width="712" height="64" rx="8" fill="#f0fdfa" stroke="#0f766e" />
  <text x="44" y="214" font-size="22" fill="#0f766e" text-anchor="start" font-weight="600">2</text>
  <text x="104" y="214" font-size="22" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    shape == (5, 6)
  </text>
  <text x="478" y="214" font-size="22" fill="#0f766e" text-anchor="start" font-weight="600">Match → execute</text>
  <rect x="24" y="252" width="712" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="44" y="292" font-size="22" fill="#4b5563" text-anchor="start" font-weight="600">3</text>
  <text x="104" y="292" font-size="22" fill="#1f2937" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    shape == (2, 2)
  </text>
  <text x="478" y="292" font-size="22" fill="#4b5563" text-anchor="start">Not checked</text>
</svg>
