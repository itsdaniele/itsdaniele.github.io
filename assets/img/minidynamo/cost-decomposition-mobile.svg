<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 324"
  role="img"
  aria-labelledby="title description"
  font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
>
  <title id="title">Fewer compute kernels</title>
  <desc id="description">
    The measured 2048 by 2048 H200 benchmark launches 12 compute kernels eagerly and 2 through Inductor. Each box is one compute kernel; this is not a
    timing breakdown.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="360" height="324" rx="10" fill="#ffffff" />
  <text x="18" y="32" font-size="22" fill="#1f2937" text-anchor="start" font-weight="600">Compute kernels</text>
  <text x="18" y="62" font-size="18" fill="#4b5563" text-anchor="start">2048 × 2048 · H200</text>
  <text x="18" y="106" font-size="22" fill="#1f2937" text-anchor="start" font-weight="600">Eager</text>
  <text x="342" y="106" font-size="28" fill="#c2410c" text-anchor="end" font-weight="600">12</text>
  <rect x="18" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="45" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="72" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="99" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="126" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="153" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="180" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="207" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="234" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="261" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="288" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <rect x="315" y="128" width="20" height="40" rx="4" fill="#c2410c" stroke="#c2410c" />
  <text x="18" y="236" font-size="22" fill="#1f2937" text-anchor="start" font-weight="600">Inductor</text>
  <text x="342" y="236" font-size="28" fill="#0f766e" text-anchor="end" font-weight="600">2</text>
  <rect x="18" y="258" width="20" height="40" rx="4" fill="#0f766e" stroke="#0f766e" />
  <rect x="45" y="258" width="20" height="40" rx="4" fill="#0f766e" stroke="#0f766e" />
</svg>
