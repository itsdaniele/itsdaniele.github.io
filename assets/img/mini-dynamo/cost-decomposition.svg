<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <marker id="cd-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#737373"/>
    </marker>
    <marker id="cd-ink-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M9,0 L0,5 L9,10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="14" font-weight="600" fill="#171717">Where the time goes</text>
  <text x="40" y="56" font-size="11" fill="#737373">11 chained elementwise ops on a small tensor. Capturing a graph alone changes none of this &#8212; Inductor's speedup comes from kernel fusion.</text>

  <text x="40" y="142" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#171717">EAGER</text>
  <text x="40" y="158" font-size="10" fill="#737373">11 launches</text>

  <rect x="120" y="130" width="24" height="44" fill="#cbd5e1"/>
  <rect x="144" y="130" width="211" height="44" fill="#94a3b8"/>
  <rect x="355" y="130" width="475" height="44" fill="#ea580c"/>
  <rect x="830" y="130" width="10" height="44" fill="#0f766e"/>
  <text x="850" y="158" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#171717">~180 &#956;s</text>
  <text x="592" y="158" text-anchor="middle" font-size="10" letter-spacing="0.06em" fill="#ffffff">11 &#215; KERNEL LAUNCH</text>

  <text x="40" y="252" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#171717">INDUCTOR</text>
  <text x="40" y="268" font-size="10" fill="#737373">1 fused kernel</text>

  <rect x="120" y="240" width="3" height="44" fill="#cbd5e1"/>
  <rect x="123" y="240" width="18" height="44" fill="#94a3b8"/>
  <rect x="141" y="240" width="42" height="44" fill="#ea580c"/>
  <rect x="183" y="240" width="139" height="44" fill="#0f766e"/>
  <text x="334" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#171717">~50 &#956;s</text>

  <line x1="322" y1="288" x2="322" y2="318" stroke="#737373" stroke-width="1"/>
  <line x1="840" y1="178" x2="840" y2="318" stroke="#737373" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="322" y1="318" x2="840" y2="318" stroke="#737373" stroke-width="1" marker-start="url(#cd-ink-l)" marker-end="url(#cd-ink)"/>
  <rect x="500" y="308" width="160" height="20" fill="#ffffff"/>
  <text x="581" y="322" text-anchor="middle" font-size="11" font-style="italic" fill="#171717">savings &#8776; 130 &#956;s</text>

  <g transform="translate(120, 360)">
    <rect width="14" height="14" rx="2" fill="#cbd5e1"/>
    <text x="22" y="11" font-size="11" fill="#171717">Python boundary</text>
    <text x="22" y="26" font-size="10" fill="#737373">~0.5 &#956;s / call</text>

    <rect x="180" width="14" height="14" rx="2" fill="#94a3b8"/>
    <text x="202" y="11" font-size="11" fill="#171717">C++ dispatcher</text>
    <text x="202" y="26" font-size="10" fill="#737373">~4 &#956;s / call</text>

    <rect x="360" width="14" height="14" rx="2" fill="#ea580c"/>
    <text x="382" y="11" font-size="11" fill="#171717">Kernel launch</text>
    <text x="382" y="26" font-size="10" fill="#737373">~10 &#956;s / call</text>

    <rect x="540" width="14" height="14" rx="2" fill="#0f766e"/>
    <text x="562" y="11" font-size="11" fill="#171717">Kernel execution</text>
    <text x="562" y="26" font-size="10" fill="#737373">variable</text>
  </g>
</svg>
